<!DOCTYPE html><html lang="es"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Para Mamita Mila ❤️</title>  <script src="https://cdn.tailwindcss.com"></script><style>    body {      margin: 0;      overflow-x: hidden;      font-family: Arial, sans-serif;      background: linear-gradient(135deg, #ffd6e7, #ffc2d1, #ffe5ec);    }    @keyframes hearts {      0% {        transform: translateY(0) scale(1);        opacity: 0;      }      50% {        opacity: 1;      }      100% {        transform: translateY(-100vh) scale(1.5);        opacity: 0;      }    }    .heart {      position: fixed;      bottom: -20px;      color: rgba(255, 0, 100, 0.5);      font-size: 20px;      animation: hearts linear infinite;      pointer-events: none;    }    @keyframes glow {      0%,      100% {        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);      }      50% {        box-shadow: 0 0 45px rgba(255, 0, 100, 0.8);      }    }    .card {      animation: glow 4s infinite;    }</head><body><audio id="music" loop>    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">  </audio><script>    for (let i = 0; i < 40; i++) {      let h = document.createElement('div');      h.className = 'heart';      h.innerHTML = '❤️';      h.style.left = Math.random() * 100 + 'vw';      h.style.animationDuration = (4 + Math.random() * 6) + 's';      h.style.animationDelay = Math.random() * 5 + 's';      document.body.appendChild(h);    }    function abrirCarta() {      document.getElementById('intro').style.display = 'none';      document.getElementById('carta').style.display = 'flex';      const music = document.getElementById('music');      music.volume = 0.5;      music.play();    }  <!-- Pantalla inicial --><div id="intro"    class="h-screen flex flex-col items-center justify-center text-center text-white bg-gradient-to-br from-pink-500 to-rose-600">    <div class="text-7xl animate-bounce mb-6">      👑    </div>    <h1 class="text-5xl font-black">      Oprime Para Abrir Reina    </h1>    <p class="mt-5 text-xl">      Hay un mensaje especial para ti ❤️    </p>    <button onclick="abrirCarta()"      class="mt-10 bg-white text-rose-600 px-10 py-5 rounded-full text-2xl font-black hover:scale-110 transition-all duration-300 shadow-2xl">      🌹 Abrir Carta 🌹    </button></div>  <!-- Carta --><div id="carta" style="display:none;"    class="min-h-screen flex items-center justify-center p-6">    <div      class="card bg-white/70 backdrop-blur-xl rounded-[35px] p-10 max-w-3xl shadow-2xl">      <div class="text-center">        <div class="text-6xl">          🌹        </div>        <h1 class="text-5xl font-black text-rose-700 mt-5">          Mamita Mila        </h1>      </div>      <p class="text-gray-800 text-xl leading-10 mt-8 text-justify">        Mamita Mila…        <br><br>        Hoy quería escribirte algo que naciera directamente desde mi corazón,        porque hay sentimientos que a veces uno no logra decir en persona,        pero que merecen ser escuchados.        <br><br>        Gracias por estar conmigo desde que era apenas un niño.        Gracias por cada abrazo,        cada consejo,        cada sacrificio        y cada momento en el que me ayudaste incluso sin darte cuenta.        <br><br>        Tú ayudaste a formar gran parte del hombre que soy hoy.        Mucho de mi fuerza,        de mis valores        y de mi forma de enfrentar la vida        existen gracias a ti.        <br><br>        Nunca olvidaré el cariño tan sincero que me diste.        Ni todas las veces que estuviste ahí cuando más te necesité.        <br><br>        Quiero que siempre recuerdes algo:        <br><br>        Eres una reina.        Una mujer increíble.        Y una de las bendiciones más grandes que tengo en mi vida ❤️      </p>      <div class="mt-10 text-center">        <button          class="bg-rose-600 text-white px-8 py-4 rounded-full text-2xl font-bold shadow-2xl">          ❤️ Feliz Día De Las Madres ❤️        </button>      </div>      <div class="mt-12 text-center">        <p class="text-2xl font-black text-rose-700">          Con amor eterno,        </p>        <p class="text-3xl font-black text-pink-600 mt-2">          Tu hijo Miguelito que te ama con todo su ser ❤️        </p>      </div>    </div></div></body></html>
